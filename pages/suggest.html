<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <title>Suggestions</title>
</head>
<body>
    <container>
            <h1 class="big-text">Suggestions</h1>
        <div class="blank-box">
            <p class="text">This is a suggestions page where you can submit your ideas or games or anything you want tbh and I can do it for you probably.</p>
            <form type="hidden" name="_template" value="table"  class="vert-form" action="https://formsubmit.co/therealargy@gmail.com" method="POST">
                <input type="name" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" placeholder="Suggestions" required></textarea>
                <button type="submit" class="button">Submit</button>
            </form>
        </div>
        <div>
            <button onclick="window.location.href='../index.html'" class="button home" >Back to Home</button>
        </div>
    </container>
</body>
</html>
